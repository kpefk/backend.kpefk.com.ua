name: CI

on:
    pull_request:
    push:
        branches: [main]

# Новий пуш у ту саму гілку скасовує попередній прогін — не тримаємо чергу
# на застарілих комітах.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

# Node потрібен окремо від bun: `bun run test` викликає бінарник jest, а той
# стартує під Node, а не під bun. На ubuntu-latest системний Node — 20/22, тоді
# як package.json вимагає >=24.15.0, а ESM-режим Jest (обхідник для CommonJS
# `@nestjs-modules/mailer`, див. jest.setup.mjs) потребує синхронних vm-API з
# Node 24.9+. Без цього кроку тести падають лише в CI: "Must use import to load
# ES Module: @nestjs/common".
env:
    # Тір прогону. Юніт-тести й так стартують під NODE_ENV=test (так робить Jest),
    # але задаємо явно, щоб typecheck/lint/build працювали з тією ж політикою:
    # у тірі `test` записи в ЄДЕБО заблоковані на рівні EdboService.
    NODE_ENV: test
    # Жоден із кроків не ходить у БД (юніт-тести працюють на моках), але
    # prisma.config.ts читає POSTGRES_URI через dotenv на етапі `generate`.
    POSTGRES_URI: postgresql://ci:ci@127.0.0.1:5432/ci
    NODE_OPTIONS: --max-old-space-size=4096

jobs:
    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.10
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - run: bun install --frozen-lockfile
            # Типи @prisma/client генеруються, у репозиторії їх немає —
            # без цього кроку впаде і typecheck, і build, і тести.
            - run: bunx prisma generate
            - run: bun run typecheck

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.10
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - run: bun install --frozen-lockfile
            - run: bunx prisma generate
            # Саме lint:ci, а не lint: останній має --fix і мовчки «виправляє»
            # проблеми замість того, щоб завалити прогін.
            - run: bun run lint:ci

    test:
        name: Unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.10
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - run: bun install --frozen-lockfile
            - run: bunx prisma generate
            # Діагностика оточення: ESM-режим Jest вимагає Node 24.9+, і без цих
            # рядків у логу неможливо відрізнити «Node не той» від «jest стартує
            # не під тим рантаймом».
            - name: Environment
              run: |
                  echo "node:  $(node -v)   ($(which node))"
                  echo "bun:   $(bun -v)"
                  node --experimental-vm-modules -e "console.log('vm.SourceTextModule:', typeof require('vm').SourceTextModule)"
            - run: bun run test

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.10
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - run: bun install --frozen-lockfile
            - run: bunx prisma generate
            - run: bun run build

    migrations:
        name: Migrations
        runs-on: ubuntu-latest
        # Ловить дві речі, яких не бачать інші кроки: міграцію, що не
        # застосовується на чистій базі, і розбіжність між історією міграцій
        # і schema.prisma (`migrate diff` нижче має дати порожній результат).
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: ci
                    POSTGRES_PASSWORD: ci
                    POSTGRES_DB: ci
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.10
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
            - run: bun install --frozen-lockfile
            - run: bunx prisma generate
            - name: Apply migrations to a clean database
              run: bunx prisma migrate deploy
            # Порівнюємо РЕАЛЬНО змігровану базу зі schema.prisma. Саме так
            # ловиться розрив, через який домен дипломів свого часу жив лише
            # в dev/production (створений через `db push`), а тір з нуля
            # піднімався без нього. --exit-code: 0 — різниці немає, 2 — є.
            - name: Schema matches migration history
              run: bunx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
